name: Atlas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Atlas dry run
        run: python atlas/run_once.py

      - name: Save Atlas history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update Atlas history"
            git push
          fi
